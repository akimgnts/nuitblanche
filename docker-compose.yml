services:
  api:
    build:
      context: ./backend

    environment:
      NUIT_BLANCHE_API_KEY: ${NUIT_BLANCHE_API_KEY:-change-me}
      NUIT_BLANCHE_DOWNLOAD_URL_SECRET: ${NUIT_BLANCHE_DOWNLOAD_URL_SECRET:-change-me-too}
      NUIT_BLANCHE_DOWNLOAD_URL_TTL_SECONDS: ${NUIT_BLANCHE_DOWNLOAD_URL_TTL_SECONDS:-86400}
      NUIT_BLANCHE_MAX_PAYLOAD_BYTES: ${NUIT_BLANCHE_MAX_PAYLOAD_BYTES:-2000000}
      NUIT_BLANCHE_GENERATION_TIMEOUT_SECONDS: ${NUIT_BLANCHE_GENERATION_TIMEOUT_SECONDS:-60}
      NUIT_BLANCHE_LOG_LEVEL: ${NUIT_BLANCHE_LOG_LEVEL:-INFO}

    volumes:
      - ./backend/generated:/app/generated
