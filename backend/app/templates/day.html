{% extends "base.html" %}
{% block content %}
  {% include "partials/topbar.html" %}
  <div class="content">
    <div class="day-header">
      <div class="day-title">{{ day_name }}</div>
      <div class="day-date">{{ day_date_label }}</div>
    </div>
    <div class="events events--{{ template }}">
      {% for event in events %}
        {% include "partials/event_card.html" %}
      {% endfor %}
    </div>
  </div>
  <div class="page">{{ page_label }}</div>
{% endblock %}
